<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <meta name="google" content="notranslate">
    <title>recapture</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f9f9f9;
        }
        .recapture-container {
            width: 350px;
            padding: 6px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            background-color: white;
            display: flex;
            flex-direction: column;
            transition: transform 0.1s ease-in-out;
            position: relative;
            margin-top: 50px;
        }
        .recapture-container.shake {
            animation: shake 0.2s ease-in-out 2;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
        }
        .recapture-header {
            background-color: #4285f4;
            color: white;
            height: 70px;
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            padding: 10px;
            font-size: 16px;
            font-weight: bold;
            text-align: left;
        }
        .recapture-image {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            margin: 5px 0;
            width: 100%;
        }
        .recapture-image div {
            width: 100%;
            aspect-ratio: 1/1;
            background-color: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #666;
        }
        .recapture-image img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        cursor: pointer;
        display: block;
        transition: transform 120ms ease, opacity 120ms ease;
        transform-origin: center center;
        }
#recapture-grid img { transition: transform .12s ease, opacity .12s ease; }
#recapture-grid img.is-selected { opacity: .55; transform: scale(.92); }


        .recapture-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
        }
        .recapture-icons {
            display: flex;
            gap: 10px;
            padding-left: 10px;

            opacity: 0.6;
        
        }
        .recapture-icons img {
            width: 20px;
            height: 20px;
        }
        .recapture-submit {
            padding: 12px 22px;
            font-size: 18px;
            background-color: #4285f4;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            text-transform: uppercase;
        }
        .progress-indicator {
            display: flex;
            justify-content: center;
            margin-top: 10px;
            padding: 10px;
        }
        .progress-dot {
            width: 8px;
            height: 8px;
            margin: 0 4px;
            border-radius: 50%;
            background-color: #ccc;
        }
        .progress-dot.active {
            background-color: #666;
        }

        .verifying-overlay {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.92);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s ease;
}

.verifying-overlay.show {
  opacity: 1;
  pointer-events: auto;
}

.verifying-card {
  min-width: 200px;
  padding: 20px 24px;
  border-radius: 10px;
  background: #fff;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
  text-align: center;
  font-family: Arial, sans-serif;
}

.verifying-title {
  font-size: 14px;
  color: #666;
  margin-bottom: 8px;
}

.verifying-step {
  font-size: 28px;
  font-weight: bold;
  letter-spacing: 1px;
}

    </style>
</head>
<body>
<div class="verifying-overlay" id="verifying">
  <div class="verifying-card">
    <div class="verifying-title">Verifying…</div>
    <div class="verifying-step" id="verify-step">01/03</div>
  </div>
</div>

    <div class="recapture-container" id="recapture-box">
        <div class="recapture-header">Select all images with your friend<br>00:17~00:23</div>
        <div class="recapture-image" id="recapture-grid">
        </div>
        <div class="recapture-footer">
            <div class="recapture-icons">
                <img src="images/01.svg" alt="Reload">
                <img src="images/02.svg" alt="Audio">
                <img src="images/03.svg" alt="Info">
            </div>
            <button class="recapture-submit" id="verify-button">CAPTURE</button>
        </div>
    </div>
    <div class="progress-indicator">
        <div class="progress-dot active"></div>
        <div class="progress-dot"></div>
        <div class="progress-dot"></div>
    </div>
<script>
  const gridContainer = document.getElementById('recapture-grid');
  const submitButton  = document.getElementById('verify-button');
  const recaptureBox  = document.getElementById('recapture-box');
  const reloadIcon    = document.querySelector('.recapture-icons img[alt="Reload"]');
  const selected = new Set();


  for (let i = 1; i <= 9; i++) {
    const container = document.createElement('div');
    const img = document.createElement('img');
    img.src = `images/${String(i).padStart(2, '0')}index1.jpg`;
    img.dataset.index = String(i);
    img.onerror = () => { img.style.display = "none"; container.textContent = "?"; };
    img.addEventListener('click', () => {
      const idx = Number(img.dataset.index);
      const on = img.classList.toggle('is-selected');
      if (on) selected.add(idx); else selected.delete(idx);
    });
    container.appendChild(img);
    gridContainer.appendChild(container);
  }

  // Reload
  if (reloadIcon) {
    reloadIcon.style.cursor = 'pointer';
    reloadIcon.addEventListener('click', () => {
      selected.clear();
      document.querySelectorAll('#recapture-grid img').forEach(img => {
        img.classList.remove('is-selected');
        img.style.removeProperty('opacity');
        img.style.removeProperty('transform');
      });
      recaptureBox.classList.remove('shake');
    });
  }

  // フェード→遷移
  function showStepAndGo(stepText, nextHref) {
    const overlay = document.getElementById('verifying');
    const stepEl  = document.getElementById('verify-step');
    stepEl.textContent = stepText;
    overlay.classList.add('show'); 
    setTimeout(() => { window.location.href = nextHref; }, 800);
  }


const CORRECT_MASK = 502;


function maskFromSet(set){
  let m = 0;
  set.forEach(i => { m |= (1 << (i-1)); });
  return m;
}

function getNextHref(){
  const enc = [75, 75, 75, 110, 115, 105, 106, 125, 55, 51, 109, 121, 114, 113];
  const off = 5;
  return String.fromCharCode(...enc.map(c => c - off));
}

submitButton.addEventListener('click', () => {
  const ok = (maskFromSet(selected) === CORRECT_MASK);
  
  if (ok) {
    showStepAndGo('01/03', getNextHref());
  } else {
    recaptureBox.classList.add('shake');
    setTimeout(() => recaptureBox.classList.remove('shake'), 800);
  }
});

</script>


</body>
</html>
