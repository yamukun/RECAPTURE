<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>recapture</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #f9f9f9;
        }
        .recapture-container {
            width: 350px;
            padding: 6px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            background-color: white;
            display: flex;
            flex-direction: column;
            transition: transform 0.1s ease-in-out;
            position: relative;
            margin-top: 50px;
        }
        .recapture-container.shake {
            animation: shake 0.2s ease-in-out 2;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
        }
        .recapture-header {
            background-color: #4285f4;
            color: white;
            height: 70px;
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            padding: 10px;
            font-size: 14px;
            font-weight: bold;
            text-align: left;
        }
        .recapture-image {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            margin: 5px 0;
            width: 100%;
        }
        .recapture-image div {
            width: 100%;
            aspect-ratio: 1/1;
            background-color: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #666;
        }
        .recapture-image img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        cursor: pointer;
        display: block;
        transition: transform 120ms ease, opacity 120ms ease; /* ← アニメ */
        transform-origin: center center;
        }
#recapture-grid img { transition: transform .12s ease, opacity .12s ease; }
#recapture-grid img.is-selected { opacity: .55; transform: scale(.92); }


        .recapture-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
        }
        .recapture-icons {
            display: flex;
            gap: 10px;
            padding-left: 10px;

            opacity: 0.6;
        
        }
        .recapture-icons img {
            width: 20px;
            height: 20px;
        }
        .recapture-submit {
            padding: 12px 22px;
            font-size: 18px;
            background-color: #4285f4;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            text-transform: uppercase;
        }
        .progress-indicator {
            display: flex;
            justify-content: center;
            margin-top: 10px;
            padding: 10px;
        }
        .progress-dot {
            width: 8px;
            height: 8px;
            margin: 0 4px;
            border-radius: 50%;
            background-color: #ccc;
        }
        .progress-dot.active {
            background-color: #666;
        }

        .verifying-overlay {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.92);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s ease;
}

.verifying-overlay.show {
  opacity: 1;
  pointer-events: auto;
}

.verifying-card {
  min-width: 200px;
  padding: 20px 24px;
  border-radius: 10px;
  background: #fff;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
  text-align: center;
  font-family: Arial, sans-serif;
}

.verifying-title {
  font-size: 14px;
  color: #666;
  margin-bottom: 8px;
}

.verifying-step {
  font-size: 28px;
  font-weight: bold;
  letter-spacing: 1px;
}

    </style>
</head>
<body>
    <!-- 認証ステップ表示オーバーレイ -->
<div class="verifying-overlay" id="verifying">
  <div class="verifying-card">
    <div class="verifying-title">Verifying…</div>
    <div class="verifying-step" id="verify-step">03/03</div>
  </div>
</div>

    <div class="recapture-container" id="recapture-box">
        <div class="recapture-header">01:43~01:47<br>[◢◣◤◥] [◥▼◤/◀▶] [◤◣◢◀▶] [◣◢/▼▲] [◣◤◥◢] [◤◣◢◀▶/▶◥] [◢◣◤◥/◀▶]</div>
        <div class="recapture-image" id="recapture-grid">
            <!-- 9 images will be inserted here -->
        </div>
        <div class="recapture-footer">
            <div class="recapture-icons">
                <img src="images/01.svg" alt="Reload">
                <img src="images/02.svg" alt="Audio">
                <img src="images/03.svg" alt="Info">
            </div>
            <button class="recapture-submit" id="verify-button">CAPTURE</button>
        </div>
    </div>
    <div class="progress-indicator">
        <div class="progress-dot active"></div>
        <div class="progress-dot active"></div>
        <div class="progress-dot active"></div>
    </div>
<script>
  const gridContainer = document.getElementById('recapture-grid');
  const submitButton  = document.getElementById('verify-button');
  const recaptureBox  = document.getElementById('recapture-box');
  const reloadIcon    = document.querySelector('.recapture-icons img[alt="Reload"]');

  // 状態
  const selected = new Set();          // 画像の選択用（演出的に使うだけ）
  let tapCount = 0;                    // CAPTURE連打カウント
  const TAP_TARGET = 8;                // 8回で遷移
  const resetTapCount = () => { tapCount = 0; };

  // 9枚の画像を生成・挿入（index3用パス）
  for (let i = 1; i <= 9; i++) {
    const container = document.createElement('div');
    const img = document.createElement('img');
    img.src = `images/${String(i).padStart(2, '0')}index3.png`;
    img.dataset.index = String(i);

    img.onerror = () => { img.style.display = "none"; container.textContent = "?"; };

    // 画像タップは演出だけ（カウンタは触らない／遷移に無関係）
  img.addEventListener('click', () => {
    resetTapCount(); // ← 連打中断

    const idx = Number(img.dataset.index);
    const on  = img.classList.toggle('is-selected');
    if (on) selected.add(idx); else selected.delete(idx);
  });

  container.appendChild(img);
  gridContainer.appendChild(container);
}
  // CAPTURE：毎回震える＋連打カウント、8回で 03/03 → index4
  submitButton.addEventListener('click', () => {
    recaptureBox.classList.add('shake');
    setTimeout(() => recaptureBox.classList.remove('shake'), 800);

    tapCount += 1;
    if (tapCount >= TAP_TARGET) {
      showStepAndGo('03/03', 'index4.html');
      resetTapCount();
    }
  });


  // Reloadの既存挙動（選択可視をリセット）
  if (reloadIcon) {
    reloadIcon.addEventListener('click', () => {
      selected.clear();
      document.querySelectorAll('#recapture-grid img').forEach(img => {
        img.classList.remove('is-selected');
        img.style.removeProperty('opacity');
        img.style.removeProperty('transform');
      });
      recaptureBox.classList.remove('shake');
    });
  }

  // フェード→遷移（03/03表示）
  function showStepAndGo(stepText, nextHref) {
    const overlay = document.getElementById('verifying');
    const stepEl  = document.getElementById('verify-step');
    stepEl.textContent = stepText;
    overlay.classList.add('show');
    setTimeout(() => { window.location.href = nextHref; }, 800);
  }
</script>

</body>
</html>
